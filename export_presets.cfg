[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Reuses the set-piece-master custom 2D-only web template (Godot 4.3-stable
; source build, optimize=size lto=thin threads=no disable_3d=yes): 5.07MB gz
; wasm vs 8MB stock, single-threaded => no COOP/COEP needed on Pages.
custom_template/release="/opt/games/set-piece-master/build/custom_template/web_template_release_2d_only.zip"
exclude_filter="res://tools/*,res://tests/*,res://build/*,res://docs/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

